{% extends 'base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block main %}
  <div class="d-flex justify-content-center">
      <div class="card col-8 mb-4 mt-4">
          <div class="card-body">
              <h2 class="text-center">Add a new article</h2>
              <form action="" method="post" enctype="multipart/form-data">
                {% csrf_token %}
                  <!--  Fields for filling-->
                  {{ form.as_p }}
                  <button class="btn btn-dark" type="submit">Add article</button>
              </form>
          </div>
      </div>
  </div>
{% endblock %}
